services:
  - type: web
    name: japan-travel-planner-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: corepack enable && corepack prepare pnpm@10.14.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @japan-travel-planner/api build
    startCommand: pnpm --filter @japan-travel-planner/api exec prisma migrate deploy && pnpm --filter @japan-travel-planner/api start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: japan-travel-planner-db
          property: connectionString
      - key: WEB_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: TRUST_PROXY_HOPS
        value: "1"

databases:
  - name: japan-travel-planner-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: japan_travel_planner_ai
    user: japan_travel_planner
    ipAllowList: []

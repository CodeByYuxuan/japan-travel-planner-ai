name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Install, lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: japan_travel_planner_ai
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d japan_travel_planner_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 is the active LTS line as of June 2026.
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        env:
          DATABASE_URL: postgresql://ci-user:ci-database-secret@localhost:5432/ci
          GOOGLE_MAPS_API_KEY: ci-google-maps-server-secret
          JWT_SECRET: ci-jwt-server-secret-value
          OPENAI_API_KEY: sk-ci-openai-server-secret-value
          RAKUTEN_ACCESS_KEY: ci-rakuten-access-server-secret
          RAKUTEN_APP_ID: ci-rakuten-app-server-secret
          WEATHER_API_KEY: ci-weather-server-secret
        run: pnpm build

      - name: Check client bundle for server secrets
        env:
          DATABASE_URL: postgresql://ci-user:ci-database-secret@localhost:5432/ci
          GOOGLE_MAPS_API_KEY: ci-google-maps-server-secret
          JWT_SECRET: ci-jwt-server-secret-value
          OPENAI_API_KEY: sk-ci-openai-server-secret-value
          RAKUTEN_ACCESS_KEY: ci-rakuten-access-server-secret
          RAKUTEN_APP_ID: ci-rakuten-app-server-secret
          WEATHER_API_KEY: ci-weather-server-secret
        run: pnpm check:client-secrets

      - name: Install Playwright Chromium
        run: pnpm --filter @japan-travel-planner/web exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm --filter @japan-travel-planner/web test:e2e

      - name: Production smoke E2E
        env:
          PRODUCTION_SMOKE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/japan_travel_planner_ai?schema=public
        run: pnpm --filter @japan-travel-planner/web test:e2e:production
